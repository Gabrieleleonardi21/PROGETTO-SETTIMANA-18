spring.application.name=u5d7

# Segreti (DB_PASSWORD, JWT_SECRET, MAIL_*, OPENROUTER_API_KEY) letti da env.properties nella root del BE, file non versionato
spring.config.import=optional:file:env.properties

# --- Database (Postgres locale) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/u5d7
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Niente sessione Hibernate aperta durante la serializzazione: i DTO vanno costruiti dentro i service
spring.jpa.open-in-view=false

server.port=3001

# --- Frontend ---
# Origini autorizzate (separate da virgola) sia per CORS (/api/**) sia per l'handshake WebSocket (/ws).
# Per provare dal telefono aggiungere in env.properties: ALLOWED_ORIGINS=http://localhost:5173,http://<IP-del-Mac>:5173
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
# Base URL del frontend usata per costruire il link di verifica inviato via email
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- JWT ---
# Il segreto NON ha default: deve stare in env.properties (almeno 32 caratteri)
app.jwt.secret=${JWT_SECRET}
# Durata del token in millisecondi (1 ora)
app.jwt.expiration-ms=3600000

# --- Email (Gmail SMTP con app password) ---
# MAIL_USERNAME (indirizzo Gmail) e MAIL_PASSWORD (app password a 16 caratteri) vanno in env.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Thymeleaf: solo template email, niente pagine web ---
spring.thymeleaf.enabled=false

# --- LLM (OpenRouter, API compatibile OpenAI) per il suggerimento del prossimo messaggio ---
app.llm.base-url=https://openrouter.ai/api/v1
# La chiave NON ha default: se manca, l'avvio fallisce subito
app.llm.api-key=${OPENROUTER_API_KEY}
# Modelli in ordine di preferenza: se il primo e' saturo (429 del pool gratuito) OpenRouter passa al successivo
app.llm.modelli=nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free
# Quanti messaggi recenti della chat inviare all'IA come contesto
app.llm.max-messaggi-contesto=20
app.llm.timeout-connessione-secondi=5
app.llm.timeout-lettura-secondi=60
