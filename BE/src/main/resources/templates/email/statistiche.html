<!DOCTYPE html>
<!-- Consegna, punto 3: template Thymeleaf dell'email con le statistiche. th:text fa l'escape dei valori -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Le tue statistiche</title>
</head>
<body style="margin:0; padding:24px; background:#e5ddd5; font-family:system-ui, sans-serif; color:#222;">
	<div style="max-width:480px; margin:0 auto; background:#fff; border-radius:10px; overflow:hidden;">
		<div style="background:#075e54; color:#fff; padding:16px 24px;">
			<h1 style="margin:0; font-size:20px;">Le tue statistiche</h1>
		</div>
		<div style="padding:24px;">
			<p>Ciao <strong th:text="${username}">utente</strong>, ecco il riepilogo della tua attivita':</p>
			<table style="width:100%; border-collapse:collapse;">
				<tr style="border-bottom:1px solid #eee;">
					<td style="padding:8px 0;">Messaggi inviati</td>
					<td style="padding:8px 0; text-align:right; font-weight:bold;" th:text="${stat.messaggiInviati}">0</td>
				</tr>
				<tr style="border-bottom:1px solid #eee;">
					<td style="padding:8px 0;">Messaggi ricevuti</td>
					<td style="padding:8px 0; text-align:right; font-weight:bold;" th:text="${stat.messaggiRicevuti}">0</td>
				</tr>
				<tr>
					<td style="padding:8px 0;">Chat aperte</td>
					<td style="padding:8px 0; text-align:right; font-weight:bold;" th:text="${stat.chatAperte}">0</td>
				</tr>
			</table>
			<p style="color:#777; font-size:12px; margin-top:24px;">Hai richiesto tu questo riepilogo dall'applicazione.</p>
		</div>
	</div>
</body>
</html>
